[project]
name = "talenteureka-ai"
version = "0.1.0"
description = "Candidate-first career discovery with explainable matching"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pypdf>=5,<6",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
semantic = ["sentence-transformers>=3,<6", "pgvector>=0.3,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

